[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nodeset-linker"
version = "v0.1.1-alpha"
description = "Semantic dependency linker and tree shaker for OPC UA Information Models."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache License 2.0" }
maintainers = [{ name = "Andreas Heine" }]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "lxml>=5.0",
    "networkx>=3.2",
    "pydantic>=2.7",
    "click>=8.1",
    "rich>=13.7",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/AndreasHeine/opcua-nodeset-linker"
Repository = "https://github.com/AndreasHeine/opcua-nodeset-linker"
Issues = "https://github.com/AndreasHeine/opcua-nodeset-linker/issues"

[project.optional-dependencies]
asyncua = ["asyncua>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.6",
    "types-PyYAML",
    "types-networkx",
]

[project.scripts]
nodeset-linker = "nodeset_linker.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nodeset_linker"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["D203", "D213"]

# Docstring conventions are enforced by mypy strict typing instead; the D rules would
# only demand boilerplate on small internal helpers.
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "E501", "B017"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
show_error_codes = true

# lxml ships no stubs and its third-party stub package is incomplete; the parser and
# exporter are thin XML adapters, so their lxml calls stay unchecked here.
[[tool.mypy.overrides]]
module = ["lxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=nodeset_linker --cov-report=term-missing"
