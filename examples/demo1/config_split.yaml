# Demo 1 again, exported as one NodeSet per namespace instead of one merged file (see config.yaml).
# The reduction is identical: the same 1,669 retained nodes, each in exactly one file, its own
# namespace, and every cross-namespace dependency still a reference.
#
# The files only resolve when loaded together, so inspect them as a folder:
#   nodeset-linker stats out\demo1_split
#   nodeset-linker validate out\demo1_split --schema tests\data\schema\UANodeSet.xsd
nodesets:
  - examples/demo1/nodesets/Opc.Ua.NodeSet2.xml
  - examples/demo1/nodesets/Opc.Ua.Di.NodeSet2.xml
  - examples/demo1/nodesets/Opc.Ua.IA.NodeSet2.xml
  - examples/demo1/nodesets/Opc.Ua.Machinery.NodeSet2.xml
  - examples/demo1/nodesets/Opc.Ua.MachineTool.NodeSet2.xml
  - examples/demo1/nodesets/ShowCaseMachineTool.xml
  - examples/demo1/nodesets/Opc.Ua.Machinery.Jobs.Nodeset2.xml
  - examples/demo1/nodesets/opc.ua.isa95-jobcontrol.nodeset2.xml

mode: STRICT

roots:
  - nodeid=nsu=http://umati.org/UA/ShowCaseMachineTool/;i=5003

external:
  - http://opcfoundation.org/UA/

export:
  mode: split
  directory: out/demo1_split

validate_before_export: true
mark_namespace_subsets: true
